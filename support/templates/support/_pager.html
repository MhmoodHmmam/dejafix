{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a class="btn" href="?{% if status %}status={{ status }}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn" href="?{% if status %}status={{ status }}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next</a>{% endif %}
</nav>
{% endif %}
